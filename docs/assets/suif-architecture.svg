<svg width="1180" height="420" viewBox="0 0 1180 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8F3EA"/>
    </linearGradient>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#7A1F2B"/>
      <stop offset="1" stop-color="#C59B43"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#7A1F2B"/>
    </marker>
  </defs>
  <rect width="1180" height="420" rx="26" fill="#FBFAF7"/>
  <text x="60" y="58" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800" fill="#3A2E2E">Arquitectura base MVC</text>
  <text x="60" y="92" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#6B5E5E">Separación de presentación, lógica de negocio y persistencia de datos.</text>

  <g filter="url(#s)">
    <rect x="60" y="140" width="250" height="180" rx="22" fill="url(#card)" stroke="#E3D7C6"/>
    <rect x="60" y="140" width="250" height="58" rx="22" fill="url(#header)"/>
    <text x="86" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">View</text>
    <text x="86" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4D4444">HTML, CSS y Vue.js</text>
    <text x="86" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">Interfaz, interacción y</text>
    <text x="86" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">renderizado de pantallas.</text>
  </g>

  <g filter="url(#s)">
    <rect x="465" y="140" width="250" height="180" rx="22" fill="url(#card)" stroke="#E3D7C6"/>
    <rect x="465" y="140" width="250" height="58" rx="22" fill="url(#header)"/>
    <text x="491" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">Controller</text>
    <text x="491" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4D4444">Laravel 4.1</text>
    <text x="491" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">Orquesta rutas, permisos,</text>
    <text x="491" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">validaciones y respuestas.</text>
  </g>

  <g filter="url(#s)">
    <rect x="870" y="140" width="250" height="180" rx="22" fill="url(#card)" stroke="#E3D7C6"/>
    <rect x="870" y="140" width="250" height="58" rx="22" fill="url(#header)"/>
    <text x="896" y="176" font-family="Segoe UI, Arial, sans-serif" font-size="23" font-weight="800" fill="#FFFFFF">Model</text>
    <text x="896" y="232" font-family="Segoe UI, Arial, sans-serif" font-size="17" fill="#4D4444">PostgreSQL</text>
    <text x="896" y="264" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">Entidades, consultas y</text>
    <text x="896" y="287" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">persistencia del sistema.</text>
  </g>

  <path d="M320 230H452" stroke="#7A1F2B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M725 230H857" stroke="#7A1F2B" stroke-width="4" marker-end="url(#arrow)"/>
  <path d="M995 330C995 382 184 382 184 330" stroke="#C59B43" stroke-width="4" stroke-dasharray="10 10" marker-end="url(#arrow)"/>
  <text x="470" y="386" font-family="Segoe UI, Arial, sans-serif" font-size="15" fill="#6B5E5E">Respuesta hacia la interfaz</text>
</svg>
