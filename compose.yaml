services:
  app:
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: "${DB_DATABASE:-suif}"
      POSTGRES_USER: "${DB_USERNAME:-suif}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:-suif_local}"
    ports:
      - "${DB_FORWARD_PORT:-5433}:5432"
    volumes:
      - suif_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  suif_postgres_data:
